name: Verification Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:run

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install locked dependencies
        # This job never launches a browser; skipping the Playwright browser
        # download keeps ~150 MB out of every unit-test run.
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Run unit tests
        run: npm run test:run
      - name: Rebuild bundles
        run: npm run build
      - name: Verify committed bundles match source
        run: git diff --exit-code -- src/analyzer-bundle.js src/telemetry-bundle.js

  # End-to-end: the committed bundle is graded against fixtures whose rendering
  # strategy and delivery headers are known by construction, and then the whole
  # extension is installed in a real browser. Unit tests cannot catch a
  # regression that only appears once fetch, DOMParser, the live DOM, the
  # manifest and the service worker are all involved.
  detection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Grade detection against the offline fixtures
        run: npm run validate:local
      # Installs the unpacked extension in a throwaway profile: the manifest,
      # the service worker, probe.js as a real content script and every
      # extension page. The harness above never loads the extension at all, so
      # a manifest Chromium rejects would sail past it.
      - name: Verify the extension installs and runs
        run: npm run validate:extension
