name: Extension Release

# Push a tag like v3.8.0 (matching extension/manifest.json) to build the
# Chrome Web Store and Firefox (AMO) zips, attach them to a GitHub Release,
# and submit both to their stores.
#
# Store submission needs these repository secrets. When they are absent the
# workflow still builds and releases, and only skips the upload steps — so a
# tag never fails because credentials were not set up yet.
#
#   CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN / CWS_EXTENSION_ID
#     Google Cloud OAuth client (Chrome Web Store API enabled) plus the
#     extension id from the CWS dashboard URL. CWS_PUBLISHER_ID is only
#     needed when publishing under a group publisher.
#   AMO_JWT_ISSUER / AMO_JWT_SECRET
#     addons.mozilla.org -> Manage API Keys.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r .version extension/manifest.json)"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match manifest.json ($MANIFEST_VERSION)" >&2
            exit 1
          fi

      - name: Install extension dev dependencies
        # Release builds never launch a browser (the detection harness runs in
        # the verify workflow), so skip Playwright's browser download.
        run: cd extension && npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run tests
        run: cd extension && npm run test:run

      # AMO reviewers rebuild the bundles and diff them against the package.
      # Catching a stale bundle here costs 20 seconds; catching it after
      # submission costs a rejected review.
      - name: Verify committed bundles match their sources
        run: |
          cd extension
          npm run build
          if ! git diff --exit-code -- src/analyzer-bundle.js src/telemetry-bundle.js; then
            echo "::error::Committed bundles differ from a fresh build. Run 'cd extension && npm run build' and commit the result." >&2
            exit 1
          fi

      - name: Build Chrome extension zip
        run: |
          cd extension
          zip -r "../csr-ssr-detector-${GITHUB_REF_NAME}.zip" \
            manifest.json popup.html popup.js popup.css \
            options.html options.js options.css \
            background.js welcome.html welcome.js welcome.css \
            devtools/ icon*.png src/ _locales/ \
            -x '*.DS_Store' '*/__tests__/*' '*/fixtures/*'

      - name: Build Firefox extension zip
        run: |
          node extension/scripts/build-firefox.js --zip
          mv extension/dist/csr-ssr-detector-firefox-*.zip .

      - name: Create GitHub Release with zips
        uses: softprops/action-gh-release@v2
        with:
          files: |
            csr-ssr-detector-v*.zip
            csr-ssr-detector-firefox-v*.zip
          generate_release_notes: true

      # Running the CLI with no sub-command uploads *and* publishes. The store
      # then puts the version into review and rolls it out once it passes.
      - name: Publish to Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$EXTENSION_ID" ]; then
            echo "::warning::Chrome Web Store secrets not configured - skipping publish"
            exit 0
          fi
          npx --yes chrome-webstore-upload-cli@4 \
            --source "csr-ssr-detector-${GITHUB_REF_NAME}.zip"

      # --approval-timeout 0 uploads and validates without waiting to be
      # signed: a listed version waits on human review for days, which no CI
      # job should sit through. Upload failures still fail the step.
      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ]; then
            echo "::warning::AMO secrets not configured - skipping submission"
            exit 0
          fi
          npx --yes web-ext@10 sign \
            --source-dir extension/dist/firefox \
            --channel listed \
            --approval-timeout 0
