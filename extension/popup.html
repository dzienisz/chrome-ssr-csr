<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CSR vs SSR Detector</title>
    <link rel="stylesheet" href="src/ui/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>
        <img src="icon48.png" alt="" width="20" height="20" />
        <span data-i18n="appName">CSR vs SSR Detector</span>
      </h1>
      <div class="app-actions">
        <button
          class="btn btn-icon"
          id="rerun"
          title="Analyze again"
          data-i18n-title="rerun"
          aria-label="Analyze again"
          data-i18n-aria-label="rerun"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6a5.94 5.94 0 0 1 4.22 1.78L13 11h7V4z"
            />
          </svg>
        </button>
        <button
          class="btn btn-icon"
          id="settings"
          title="Settings"
          data-i18n-title="settings"
          aria-label="Settings"
          data-i18n-aria-label="settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M19.14 12.94a7.1 7.1 0 0 0 0-1.88l2.03-1.58a.48.48 0 0 0 .12-.61l-1.92-3.32a.48.48 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58a7.1 7.1 0 0 0 0 1.88l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6A3.6 3.6 0 1 1 15.6 12 3.6 3.6 0 0 1 12 15.6"
            />
          </svg>
        </button>
      </div>
    </header>

    <div id="pin-banner" class="notice" hidden>
      <span>
        <strong data-i18n="pinTitle">Pin the extension</strong>
        <span data-i18n="pinBody">
          (puzzle icon → pin) to check any page in one click.</span
        >
      </span>
      <button
        class="notice-close"
        id="pin-dismiss"
        title="Dismiss"
        data-i18n-title="dismiss"
        aria-label="Dismiss"
        data-i18n-aria-label="dismiss"
      >
        ✕
      </button>
    </div>

    <main id="main">
      <div id="status" class="empty" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span data-i18n="analyzing">Analyzing this page…</span>
      </div>

      <div id="report" hidden>
        <div id="verdict"></div>

        <nav class="tabs" role="tablist" aria-label="Report sections">
          <button class="tab" role="tab" data-panel="overview" aria-selected="true" id="tab-overview">
            <span data-i18n="tabOverview">Overview</span>
          </button>
          <button class="tab" role="tab" data-panel="signals" aria-selected="false" id="tab-signals">
            <span data-i18n="tabSignals">Evidence</span>
            <span class="tab-count" id="signal-count"></span>
          </button>
          <button class="tab" role="tab" data-panel="delivery" aria-selected="false" id="tab-delivery">
            <span data-i18n="tabDelivery">Delivery</span>
          </button>
          <button class="tab" role="tab" data-panel="diff" aria-selected="false" id="tab-diff">
            <span data-i18n="tabDiff">Regions</span>
          </button>
          <button class="tab" role="tab" data-panel="history" aria-selected="false" id="tab-history">
            <span data-i18n="tabHistory">History</span>
          </button>
        </nav>

        <div class="panels">
          <div class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview"></div>
          <div class="panel" id="panel-signals" role="tabpanel" aria-labelledby="tab-signals" hidden></div>
          <div class="panel" id="panel-delivery" role="tabpanel" aria-labelledby="tab-delivery" hidden></div>
          <div class="panel" id="panel-diff" role="tabpanel" aria-labelledby="tab-diff" hidden></div>
          <div class="panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden></div>
        </div>

        <div class="export-row">
          <button class="btn" id="copy" data-i18n="copySummary">Copy summary</button>
          <button class="btn" id="export-json">JSON</button>
          <button class="btn" id="export-md">Markdown</button>
          <button class="btn" id="export-csv">CSV</button>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLScM4Bc9XqQk_LeE9Hg6uOiZxlSd5s6Gu2fGRzRBWomKlhkPNQ/viewform"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="giveFeedback"
        >Give feedback · 1 min</a
      >
      <span>
        <span id="version"></span> ·
        <a href="https://github.com/dzienisz/chrome-ssr-csr" target="_blank" rel="noopener noreferrer"
          >GitHub</a
        >
      </span>
    </footer>

    <script src="src/ui/i18n.js"></script>
    <script src="src/ui/report.js"></script>
    <script src="src/ui/export.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
