<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rendering</title>
    <link rel="stylesheet" href="../src/ui/theme.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="panel-header">
      <div class="panel-title">
        <img src="../icon48.png" alt="" width="18" height="18" />
        <strong data-i18n="appName">CSR vs SSR Detector</strong>
        <span class="panel-url" id="page-url"></span>
      </div>
      <div class="panel-header-actions">
        <label class="auto-toggle">
          <input type="checkbox" id="auto-rerun" checked />
          <span data-i18n="rerunOnNavigation">Re-run on navigation</span>
        </label>
        <button class="btn" id="rerun" data-i18n="analyzeAgain">Analyze again</button>
        <button class="btn" id="copy" data-i18n="copySummary">Copy summary</button>
        <button class="btn" id="export-md">Markdown</button>
        <button class="btn" id="export-json">JSON</button>
      </div>
    </header>

    <div id="status" class="empty" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <span data-i18n="analyzing">Analyzing this page…</span>
    </div>

    <main id="report" class="panel-grid" hidden>
      <section class="col col-wide">
        <div id="verdict"></div>
        <div id="overview"></div>
      </section>
      <section class="col">
        <h2 class="col-title" data-i18n="tabSignals">Evidence</h2>
        <div id="signals"></div>
      </section>
      <section class="col">
        <h2 class="col-title" data-i18n="tabDelivery">Delivery</h2>
        <div id="delivery"></div>
        <h2 class="col-title" data-i18n="tabDiff">Regions</h2>
        <div id="diff"></div>
      </section>
    </main>

    <script src="../src/ui/i18n.js"></script>
    <script src="../src/ui/report.js"></script>
    <script src="../src/ui/export.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
